      <stop offset="0" stop-color="#1B1D20"/>
      <stop offset="1" stop-color="#111214"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" fill="url(#fade)"/>
  <rect width="1200" height="360" fill="url(#grid)"/>
  <path d="M0 286H1200" stroke="#3B3D41" stroke-width="1"/>
  <path d="M0 28H1200" stroke="#3B3D41" stroke-width="1"/>
  <path d="M760 0V360" stroke="#3B3D41" stroke-width="1" opacity=".8"/>
