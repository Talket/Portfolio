<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Talket — Engineering Notebook</title>
  <desc id="desc">A dark editorial banner with an abstract systems diagram and the message: build systems that work beyond the demo.</desc>
  <defs>
