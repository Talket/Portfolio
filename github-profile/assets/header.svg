    <text x="56" y="226" fill="#F1EEE7" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="700" letter-spacing="-2">Make them useful.</text>
    <text x="60" y="272" fill="#A6A7A8" font-family="monospace" font-size="13" letter-spacing="1.5">APPLIED AI  /  SOFTWARE  /  SYSTEMS</text>
