    <circle cx="940" cy="244" r="6"/><circle cx="1088" cy="244" r="6"/>
    <circle cx="1142" cy="190" r="6"/><circle cx="940" cy="302" r="6"/>
    <circle cx="1088" cy="302" r="6"/>
  </g>
  <g fill="#A6A7A8" font-family="monospace" font-size="10" letter-spacing="2">
